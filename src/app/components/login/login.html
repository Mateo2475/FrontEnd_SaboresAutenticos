
    <div class="login-page">
      <div class="login-card">
        <div class="login-brand">
          <span class="logo">SA</span>
          <h1>Sabores Auténticos</h1>
          <p>Sistema de gestión comercial</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="ingresar()">
          <div class="field">
            <label for="username">Usuario</label>
            <input id="username" type="text" formControlName="username" autocomplete="username" />
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" type="password" formControlName="password" autocomplete="current-password" (keyup)="verificarCaps($event)" (keydown)="verificarCaps($event)" />
          </div>

          @if (capsLock()) {
            <p class="warn-text">⚠ Bloq Mayús activado</p>
          }
          @if (error()) {
            <p class="error-text">{{ error() }}</p>
          }

          <button class="btn btn-primary btn-block" type="submit" [disabled]="cargando()">
            {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
          </button>
        </form>
      </div>
    </div>
